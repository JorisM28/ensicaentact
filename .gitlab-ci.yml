# Utilisation d'une image contenant Flutter et Android SDK
image: ghcr.io/cirruslabs/flutter:stable

# Définition des dossiers à mettre en cache pour accélérer les builds futurs
cache:
  paths:
    - .pub-cache/
    - bin/cache/

# Les étapes du pipeline
stages:
  - lint
  - test
  - build

# Étape 1 : Analyse du code (Linter)
lint:
  stage: lint
  script:
    - flutter pub get
    - flutter analyze

# Étape 2 : Tests unitaires
test:
  stage: test
  script:
    - flutter test --coverage
  artifacts:
    paths:
      - coverage/

# Étape 3 : Build de l'APK (Android)
build_android:
  stage: build
  script:
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-release.apk
    expire_in: 1 week
  only:
    - main # Le build ne se lance que sur la branche principale